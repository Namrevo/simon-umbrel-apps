manifestVersion: 1
id: bookorbit
category: files
name: BookOrbit
version: "2.6.0"
tagline: Self-hosted library for ebooks, audiobooks, comics and PDFs
description: >-
  BookOrbit is a self-hosted digital library and reading platform for EPUB,
  MOBI, AZW3, PDF, CBZ/CBR comics, and M4B/MP3 audiobooks. Built-in web
  readers cover every format, with two-way progress and annotation sync
  across Kobo devices, KOReader, and the web reader. Enrich your collection
  with metadata pulled from multiple providers, push reading data to
  Hardcover, and drop new files into a Book Dock folder for hands-free
  importing.

  Supports multiple users with OIDC/SSO, an OPDS catalog for compatible
  reader apps, Send-to-Kindle delivery, reading statistics, and a
  customizable dashboard - all running on your own Umbrel.
developer: BookOrbit
website: https://bookorbit.app
