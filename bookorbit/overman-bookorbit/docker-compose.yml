version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bookorbit-app
      APP_PORT: 3000

  app:
    container_name: bookorbit-app
    image: ghcr.io/bookorbit/bookorbit:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: "$APP_PASSWORD"
      POSTGRES_DB: bookorbit
      JWT_SECRET: "$APP_SEED"
      SETUP_BOOTSTRAP_TOKEN: "$APP_PASSWORD"
      APP_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PORT}"
      PUID: "1000"
      PGID: "1000"
      NODE_MAX_OLD_SPACE_SIZE: "2048"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/books:/books
      - ${APP_DATA_DIR}/data/app:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    container_name: bookorbit-db
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: "$APP_PASSWORD"
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
